name: Continuous Integration

on:
  pull_request:
    branches:
      [ main, develop ]

jobs:
  unit-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run composite action
        uses: ./.github/actions/shared
        with:
          project_config_path: ${{ vars.PROJECT_CONFIG_PATH }}

      - name: Run unit tests
        run: |
          bundle exec fastlane android test