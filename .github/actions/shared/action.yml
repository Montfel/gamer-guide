name: 'Shared Workflow'
description: 'aaar f'

inputs:
  project_config_path:
    required: true

runs:
  using: "composite"
  steps:
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 'Adding environment variables'
      run: |
        cat > fastlane/.env.defaut << EOF
        
        PROJECT_CONFIG_PATH="$PROJECT_CONFIG_PATH"
        
        EOF
      shell: bash
      env:
        PROJECT_CONFIG_PATH: ${{ inputs.project_config_path }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash

    - name: Bundle install
      run: bundle install
      shell: bash