name: Shared Workflow

inputs:
  project_config_path:
    required: true
  google_services_json_debug_path:
    required: true
  google_services_json_debug:
    required: true

runs:
  using: "composite"
  steps:
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 'Adding environment variables'
      run: |
        echo $GOOGLE_SERVICES_JSON_DEBUG > $GOOGLE_SERVICES_JSON_DEBUG_PATH 
        
        cat > fastlane/.env.default << EOF
        
        PROJECT_CONFIG_PATH="$PROJECT_CONFIG_PATH"
        
        EOF
      shell: bash
      env:
        PROJECT_CONFIG_PATH: ${{ inputs.project_config_path }}
        GOOGLE_SERVICES_JSON_DEBUG_PATH: ${{ inputs.google_services_json_debug_path }}
        GOOGLE_SERVICES_JSON_DEBUG: ${{ inputs.google_services_json_debug }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash

    - name: Bundle install
      run: bundle install
      shell: bash