[versions]
accompanist = "0.32.0"
activity = "1.8.2"
androidGradlePlugin = "8.3.1"
coil = "2.6.0"
compose = "2024.04.00"
composeCompiler = "1.5.11"
core = "1.12.0"
destinations = "1.9.53"
detekt = "1.23.3"
espresso = "3.5.1"
firebase = "32.8.0"
firebaseCrashlyticsGradle = "2.9.9"
google-services = "4.4.1"
gson = "2.10.1"
hilt = "2.49"
hiltNavigation = "1.2.0"
junit = "4.13.2"
junit-android = "1.1.5"
kotlin = "1.9.23"
ksp = "1.9.23-1.0.19"
lifecycle = "2.7.0"
okhttp = "4.11.0"
retrofit = "2.9.0"
splash = "1.0.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
firebase-crashlytics-gradle = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlyticsGradle" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

# Convention Plugins
gamerguide-android-application = { id = "gamerguide.android.application", version = "unspecified" }
gamerguide-android-library = { id = "gamerguide.android.library", version = "unspecified" }
gamerguide-android-library-compose = { id = "gamerguide.android.library.compose", version = "unspecified" }
gamerguide-kotlin-library = { id = "gamerguide.kotlin.library", version = "unspecified" }


[libraries]
accompanist = { module = "com.google.accompanist:accompanist-systemuicontroller", version.ref = "accompanist" }
activity = { module = "androidx.activity:activity-compose", version.ref = "activity" }
android-tools = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
core = { module = "androidx.core:core-ktx", version.ref = "core" }
destinations-core = { module = "io.github.raamcosta.compose-destinations:core", version.ref = "destinations" }
destinations-ksp = { module = "io.github.raamcosta.compose-destinations:ksp", version.ref = "destinations" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }
espresso = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics-ktx" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics-ktx" }
firebase-config = { module = "com.google.firebase:firebase-config-ktx" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigation" }
junit-test = { module = "junit:junit", version.ref = "junit" }
junit-test-android = { module = "androidx.test.ext:junit", version.ref = "junit-android" }
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
lifecycle-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-gson-converter = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
splash = { module = "androidx.core:core-splashscreen", version.ref = "splash" }

[bundles]
compose = ["compose-material3", "compose-ui-tooling", "compose-ui-tooling-preview"]
lifecycle = ["lifecycle-ktx", "lifecycle-compose"]
okhttp = ["okhttp", "okhttp-logging-interceptor"]
retrofit = ["retrofit", "gson", "retrofit-gson-converter"]
